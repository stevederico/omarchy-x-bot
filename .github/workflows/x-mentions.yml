name: X mentions to issues

on:
  schedule:
    # Every 5 minutes, GitHub's shortest schedule. Free because the repo is public.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test logs what would be filed and replied; live files and replies'
        type: choice
        options: [test, live]
        default: test

permissions:
  contents: read

concurrency:
  group: x-mentions
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # since_id lives in the Actions cache, not in git. Cache keys can't be overwritten,
      # so each run saves a new key and the next run restores the newest one by prefix.
      - name: Restore state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/
          key: x-state-${{ github.run_id }}
          restore-keys: x-state-

      - name: File tagged posts as issues and reply on X
        env:
          X_BEARER_TOKEN: ${{ secrets.X_READ_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_REPLY_ACCESS_TOKEN: ${{ secrets.X_REPLY_ACCESS_TOKEN }}
          X_REPLY_ACCESS_SECRET: ${{ secrets.X_REPLY_ACCESS_SECRET }}
          GH_TOKEN: ${{ secrets.OMARCHY_X_BOT_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          X_ACCOUNT_ID: ${{ vars.X_ACCOUNT_ID || '2108454467309883392' }}
          TARGET_REPO: ${{ vars.TARGET_REPO || 'stevederico/omarchy' }}
          MODE: ${{ inputs.mode || vars.MODE || 'test' }}
        run: node scripts/x-mentions-to-issues.mjs

      # Also after a failed run, so posts already handled aren't judged again.
      - name: Save state
        if: ${{ !cancelled() && hashFiles('state/since_id.txt') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/
          key: x-state-${{ github.run_id }}-${{ github.run_attempt }}
