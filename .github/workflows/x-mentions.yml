name: X mentions to issues

on:
  schedule:
    # Hourly, off the hour, like the org's other scheduled jobs.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test logs what would be filed and replied; live files and replies'
        type: choice
        options: [test, live]
        default: test

permissions:
  contents: write   # commit state/

concurrency:
  group: x-mentions
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: File tagged posts as issues and reply on X
        env:
          X_BEARER_TOKEN: ${{ secrets.X_READ_TOKEN }}
          X_OMARCHY_USER_TOKEN: ${{ secrets.X_OMARCHY_USER_TOKEN }}
          GH_TOKEN: ${{ secrets.OMARCHY_X_BOT_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          X_ACCOUNT_ID: ${{ vars.X_ACCOUNT_ID || '2108454467309883392' }}
          TARGET_REPO: ${{ vars.TARGET_REPO || 'stevederico/omarchy' }}
          MODE: ${{ inputs.mode || vars.MODE || 'test' }}
        run: node scripts/x-mentions-to-issues.mjs

      # Also after a failed run, so posts already handled aren't filed again.
      - name: Save state
        if: ${{ !cancelled() }}
        run: |
          [ -z "$(git status --porcelain -- state/)" ] && exit 0
          git config user.name "omarchy-x-bot"
          git config user.email "omarchy-x-bot@users.noreply.github.com"
          git add state/
          git commit -m "Remember the newest X mention"
          git pull --rebase -q origin "$GITHUB_REF_NAME"  # main may have moved during the run
          git push
