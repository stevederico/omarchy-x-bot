<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omarchy-x-bot funnel</title>
<style>
:root { --bg:#fafafa; --fg:#111; --muted:#777; --bar:#2f6fed; --track:#e6e6e6; }
@media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#888; --bar:#5b8cff; --track:#222; } }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, sans-serif; }
main { max-width:720px; margin:48px auto; padding:0 16px; }
h1 { font-size:20px; margin:0 0 4px; }
.range { color:var(--muted); margin-bottom:28px; }
.row { display:grid; grid-template-columns:150px 1fr 70px; gap:12px; align-items:center; margin:14px 0; }
.label { font-weight:600; }
.label small { display:block; font-weight:400; color:var(--muted); }
.track { background:var(--track); border-radius:6px; height:34px; display:flex; }
.bar { background:var(--bar); border-radius:6px; height:100%; min-width:4px; }
.num { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
.num small { display:block; font-weight:400; color:var(--muted); }
</style>
</head>
<body>
<main>
<h1>@omarchy funnel</h1>
<div class="range">Oct 25 – Nov 1, 2026</div>
<div id="f"></div>
</main>
<script>
const stages = [
  { label: 'Mentions', value: 3076 },
  { label: 'Keyword matches', value: 358 },
  { label: 'Bugs & features', sub: '4 bugs · 15 features', value: 19 },
  { label: 'Issues filed', value: 19 },
  { label: 'Replies sent', sub: '@omarchy', value: 1 },
]
const max = stages[0].value
document.getElementById('f').innerHTML = stages.map((s, i) => {
  const pct = i ? (s.value / stages[i - 1].value * 100).toFixed(1) + '%' : ''
  return `<div class="row">
    <div class="label">${s.label}${s.sub ? `<small>${s.sub}</small>` : ''}</div>
    <div class="track"><div class="bar" style="width:${Math.max(s.value / max * 100, 0.5)}%"></div></div>
    <div class="num">${s.value.toLocaleString()}${pct ? `<small>${pct}</small>` : ''}</div>
  </div>`
}).join('')
</script>
</body>
</html>
